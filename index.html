<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#060b16;
color:white;
overflow-x:hidden;
padding-bottom:100px;
}

/* Animated Gaming Background */
.bg{
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
radial-gradient(circle at 20% 20%, rgba(0,180,255,.25), transparent 25%),
radial-gradient(circle at 80% 30%, rgba(255,215,0,.18), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(140,0,255,.18), transparent 30%);
animation:moveBg 8s infinite alternate ease-in-out;
z-index:-1;
}

@keyframes moveBg{
0%{transform:translateY(0);}
100%{transform:translateY(-30px);}
}

/* Top Bar */
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px;
padding:15px;
border-radius:28px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 35px rgba(0,170,255,.18);
}

.left{
display:flex;
gap:12px;
}

.badge{
padding:14px 18px;
border-radius:18px;
background:linear-gradient(145deg,#101a2f,#182848);
box-shadow:
0 0 15px rgba(0,180,255,.2),
inset 0 0 10px rgba(255,255,255,.05);
font-weight:bold;
font-size:15px;
border:1px solid rgba(255,255,255,.08);
}

.logo{
font-size:23px;
font-weight:900;
background:linear-gradient(to right,#00d4ff,#ffd700,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px rgba(0,212,255,.3);
}

/* Banner Slider */
.banner{
margin:15px;
height:180px;
border-radius:28px;
background-size:cover;
background-position:center;
box-shadow:
0 0 25px rgba(0,180,255,.18),
0 0 35px rgba(255,215,0,.12);
border:2px solid rgba(255,255,255,.08);
}

/* Menu Cards */
.menu{
padding:15px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
position:relative;
height:120px;
border-radius:30px;
overflow:hidden;
box-shadow:0 0 35px rgba(0,0,0,.35);
transition:.25s;
border:1px solid rgba(255,255,255,.08);
}

.card:active{
transform:scale(.97);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.65);
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:25px;
background:linear-gradient(
90deg,
rgba(0,0,0,.65),
rgba(0,0,0,.15)
);
}

.title{
font-size:28px;
font-weight:900;
text-shadow:0 0 15px rgba(255,255,255,.3);
}

.sub{
font-size:14px;
margin-top:5px;
opacity:.9;
}

.arrow{
font-size:36px;
font-weight:bold;
}

/* Bottom Nav */
.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
padding:18px 0;
background:rgba(8,12,25,.92);
backdrop-filter:blur(15px);
border-top:1px solid rgba(255,255,255,.08);
box-shadow:0 -10px 25px rgba(0,0,0,.5);
}

.bottom div{
font-size:16px;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- Top -->
<div class="top">
<div class="left">
<div class="badge">👤 Profile</div>
<div class="badge">🪙 Coins: 250</div>
</div>

<div class="logo">
💎 Diamond Drop BD
</div>
</div>

<!-- Banner -->
<div class="banner" id="banner"></div>

<!-- Cards -->
<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
<div class="overlay">
<div>
<div class="title">📋 TASKS</div>
<div class="sub">Complete missions & earn rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200">
<div class="overlay">
<div>
<div class="title">🎡 SPIN</div>
<div class="sub">Spin & win premium rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200">
<div class="overlay">
<div>
<div class="title">💥 SCRATCH</div>
<div class="sub">Scratch lucky rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1486572788966-cfd3df1f5b42?w=1200">
<div class="overlay">
<div>
<div class="title">🎁 REDEEM</div>
<div class="sub">Claim your gifts & rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

</div>

<!-- Bottom -->
<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
const ads = [
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let i=0;
const banner=document.getElementById("banner");

function slide(){
banner.style.backgroundImage=`url(${ads[i]})`;
i=(i+1)%ads.length;
}

slide();
setInterval(slide,3000);
</script>

</body>
</html>
