<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050816;
overflow-x:hidden;
color:#fff;
padding-bottom:100px;
}

/* Premium Background */
body::before{
content:'';
position:fixed;
width:100%;
height:100%;
top:0;
left:0;
background:
radial-gradient(circle at top left,#00d0ff25,transparent 30%),
radial-gradient(circle at top right,#ffd70015,transparent 30%),
radial-gradient(circle at bottom,#7b00ff20,transparent 35%);
z-index:-2;
animation:bgMove 8s infinite alternate ease-in-out;
}

@keyframes bgMove{
100%{
transform:translateY(-20px);
}
}

/* Header */
.header{
margin:18px;
padding:18px;
border-radius:30px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 0 30px rgba(0,195,255,.12);
}

.profile{
display:flex;
align-items:center;
gap:12px;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00d0ff,#ffd700);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
box-shadow:0 0 25px #00d0ff55;
}

.info h3{
font-size:16px;
}

.info p{
font-size:11px;
opacity:.7;
}

.coins{
padding:14px 18px;
border-radius:20px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 15px rgba(255,215,0,.15);
font-size:14px;
}

/* Logo */
.logo{
text-align:center;
font-size:28px;
font-weight:900;
margin-top:5px;
background:linear-gradient(to right,#00d0ff,#ffd700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Banner */
.banner{
margin:18px;
height:180px;
border-radius:30px;
overflow:hidden;
position:relative;
box-shadow:0 0 30px rgba(0,212,255,.15);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* Cards */
.menu{
padding:18px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
position:relative;
padding:22px;
height:100px;
border-radius:28px;
background:rgba(255,255,255,.06);
backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center;
overflow:hidden;
box-shadow:0 8px 25px rgba(0,0,0,.35);
transition:.2s;
}

.card:active{
transform:scale(.97);
}

.card::before{
content:'';
position:absolute;
right:-40px;
top:-40px;
width:140px;
height:140px;
background:rgba(255,255,255,.04);
border-radius:50%;
}

.tasks{border-left:5px solid orange;}
.spin{border-left:5px solid violet;}
.scratch{border-left:5px solid cyan;}
.redeem{border-left:5px solid #00ff99;}

.title{
font-size:22px;
font-weight:900;
}

.sub{
font-size:11px;
opacity:.75;
margin-top:5px;
}

.arrow{
font-size:32px;
color:#00d0ff;
}

/* Bottom Menu */
.bottom{
position:fixed;
left:12px;
right:12px;
bottom:12px;
padding:18px 0;
display:flex;
justify-content:space-around;
border-radius:28px;
background:rgba(10,15,30,.88);
backdrop-filter:blur(18px);
border:2px solid rgba(0,212,255,.25);
box-shadow:
0 0 25px rgba(0,212,255,.25),
0 0 35px rgba(255,215,0,.08);
animation:glow 2s infinite alternate;
}

@keyframes glow{
100%{
box-shadow:
0 0 35px rgba(0,212,255,.4),
0 0 50px rgba(255,215,0,.15);
}
}

.bottom div{
font-size:13px;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<div class="logo">💎 Diamond Drop BD</div>

<div class="header">
<div class="profile">
<div class="avatar">👤</div>

<div class="info">
<h3>Profile</h3>
<p>Gaming Rewards User</p>
</div>
</div>

<div class="coins">
🪙 250
</div>
</div>

<div class="banner">
<img id="slide" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
</div>

<div class="menu">

<div class="card tasks">
<div>
<div class="title">📋 TASKS</div>
<div class="sub">Complete tasks & earn</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card spin">
<div>
<div class="title">🎡 SPIN</div>
<div class="sub">Spin and win rewards</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card scratch">
<div>
<div class="title">💥 SCRATCH</div>
<div class="sub">Scratch lucky card</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card redeem">
<div>
<div class="title">🎁 REDEEM</div>
<div class="sub">Claim rewards</div>
</div>
<div class="arrow">➜</div>
</div>

</div>

<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
const imgs=[
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let i=0;
const slide=document.getElementById('slide');

setInterval(()=>{
i=(i+1)%imgs.length;
slide.src=imgs[i];
},3000);
</script>

</body>
</html>
