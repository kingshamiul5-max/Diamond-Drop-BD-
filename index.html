<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#040714;
overflow-x:hidden;
color:white;
padding-bottom:120px;
}

/* Animated Background */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
background:
radial-gradient(circle at 20% 20%, rgba(0,170,255,.18), transparent 30%),
radial-gradient(circle at 80% 30%, rgba(255,215,0,.12), transparent 30%),
radial-gradient(circle at 50% 80%, rgba(130,0,255,.15), transparent 30%);
animation:bgMove 8s infinite alternate ease-in-out;
}

@keyframes bgMove{
100%{transform:translateY(-30px);}
}

/* Floating Neon Lights */
.particles span{
position:fixed;
width:10px;
height:10px;
background:#00d4ff;
border-radius:50%;
box-shadow:0 0 15px #00d4ff;
animation:float 12s linear infinite;
z-index:-1;
}

.particles span:nth-child(1){left:10%;top:90%;}
.particles span:nth-child(2){left:40%;top:80%;}
.particles span:nth-child(3){left:75%;top:85%;}
.particles span:nth-child(4){left:60%;top:95%;}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}

/* TOP PROFILE */
.profile-panel{
margin:18px;
padding:20px;
border-radius:35px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 25px rgba(0,180,255,.15),
0 0 35px rgba(255,215,0,.08);
display:flex;
justify-content:space-between;
align-items:center;
}

.left{
display:flex;
gap:12px;
align-items:center;
}

.avatar{
width:60px;
height:60px;
border-radius:50%;
background:linear-gradient(135deg,#00d4ff,#ffd700);
display:flex;
justify-content:center;
align-items:center;
font-size:28px;
box-shadow:0 0 25px rgba(0,212,255,.35);
}

.info{
font-size:13px;
}

.coins{
padding:14px 18px;
border-radius:22px;
background:linear-gradient(145deg,#121d38,#182848);
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 20px rgba(255,215,0,.15);
font-size:14px;
}

/* Logo */
.logo{
text-align:center;
font-size:30px;
font-weight:900;
margin-top:8px;
background:linear-gradient(to right,#00d4ff,#ffd700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px rgba(0,212,255,.2);
}

/* Banner */
.banner{
margin:18px;
height:190px;
border-radius:35px;
overflow:hidden;
position:relative;
border:1px solid rgba(255,255,255,.08);
box-shadow:0 0 30px rgba(0,180,255,.15);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* Menu */
.menu{
padding:18px;
display:flex;
flex-direction:column;
gap:20px;
}

.card{
position:relative;
height:110px;
border-radius:32px;
background:rgba(255,255,255,.05);
backdrop-filter:blur(20px);
border:1px solid rgba(255,255,255,.08);
display:flex;
justify-content:space-between;
align-items:center;
padding:25px;
overflow:hidden;
box-shadow:0 0 25px rgba(0,0,0,.35);
transition:.25s;
}

.card:active{
transform:scale(.97);
}

.card::before{
content:'';
position:absolute;
width:180px;
height:180px;
background:rgba(255,255,255,.06);
border-radius:50%;
right:-50px;
top:-50px;
}

.title{
font-size:25px;
font-weight:900;
}

.sub{
font-size:12px;
opacity:.8;
margin-top:5px;
}

.tasks{border-left:5px solid #ff8800;}
.spin{border-left:5px solid #b300ff;}
.scratch{border-left:5px solid #00d4ff;}
.redeem{border-left:5px solid #00ff88;}

.arrow{
font-size:34px;
}

/* Bottom Menu */
.bottom{
position:fixed;
bottom:14px;
left:12px;
right:12px;
border-radius:28px;
display:flex;
justify-content:space-around;
padding:18px 0;
background:rgba(10,15,35,.78);
backdrop-filter:blur(18px);
border:2px solid rgba(0,212,255,.35);
box-shadow:
0 0 20px rgba(0,212,255,.25),
0 0 35px rgba(255,215,0,.12);
animation:laser 2s infinite alternate;
}

@keyframes laser{
100%{
box-shadow:
0 0 30px rgba(0,212,255,.4),
0 0 45px rgba(255,215,0,.18);
}
}

.bottom div{
font-size:14px;
text-align:center;
font-weight:bold;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="particles">
<span></span>
<span></span>
<span></span>
<span></span>
</div>

<div class="logo">💎 Diamond Drop BD</div>

<div class="profile-panel">
<div class="left">
<div class="avatar">🎮</div>
<div class="info">
<h3>Player</h3>
<p>Gaming Rewards</p>
</div>
</div>

<div class="coins">🪙 250 Coins</div>
</div>

<div class="banner">
<img id="slider" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
</div>

<div class="menu">

<div class="card tasks">
<div>
<div class="title">📋 Tasks</div>
<div class="sub">Complete missions</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card spin">
<div>
<div class="title">🎡 Spin</div>
<div class="sub">Win premium rewards</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card scratch">
<div>
<div class="title">💥 Scratch</div>
<div class="sub">Lucky rewards</div>
</div>
<div class="arrow">➜</div>
</div>

<div class="card redeem">
<div>
<div class="title">🎁 Redeem</div>
<div class="sub">Claim gifts</div>
</div>
<div class="arrow">➜</div>
</div>

</div>

<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
const images = [
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let i = 0;
const slider = document.getElementById("slider");

setInterval(()=>{
i=(i+1)%images.length;
slider.src=images[i];
},3000);
</script>

</body>
</html>
