<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<style>
body{
background:#0f172a;
font-family:Arial;
color:white;
margin:0;
padding:0;
}

.top{
display:flex;
justify-content:space-between;
padding:15px;
background:#1e293b;
font-size:18px;
font-weight:bold;
}

.logo{
text-align:center;
font-size:24px;
font-weight:bold;
padding:15px;
color:#38bdf8;
}

.banner{
margin:15px;
background:#1d4ed8;
padding:20px;
border-radius:15px;
text-align:center;
font-size:20px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
padding:15px;
}

.card{
background:#1e293b;
padding:25px;
border-radius:18px;
text-align:center;
font-size:18px;
font-weight:bold;
}

.bottom{
position:fixed;
bottom:0;
width:100%;
background:#1e293b;
display:flex;
justify-content:space-around;
padding:15px 0;
font-size:14px;
}
</style>
</head>

<body>

<div class="top">
<div>👤 Profile</div>
<div>🪙 Coins</div>
</div>

<div class="logo">
💎 Diamond Drop BD
</div>

<div class="banner">
WELCOME TO DIAMOND DROP BD
</div>

<div class="grid">
<div class="card">📋 Tasks</div>
<div class="card">🎡 Spin</div>
<div class="card">💥 Scratch</div>
<div class="card">🎁 Redeem</div>
</div>

<div class="bottom">
<div>🏠 Home</div>
<div>🎁 Reward</div>
<div>🛒 Shop</div>
<div>👥 Refer</div>
</div>

</body>
</html>
