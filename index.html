<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050816;
overflow-x:hidden;
color:white;
padding-bottom:110px;
}

/* Animated Background */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
radial-gradient(circle at 20% 20%, rgba(0,170,255,.25), transparent 25%),
radial-gradient(circle at 80% 30%, rgba(255,215,0,.18), transparent 25%),
radial-gradient(circle at 50% 80%, rgba(140,0,255,.15), transparent 30%);
animation:bgMove 8s infinite alternate ease-in-out;
z-index:-2;
}

@keyframes bgMove{
0%{transform:translateY(0);}
100%{transform:translateY(-25px);}
}

/* Floating Lights */
.glow{
position:fixed;
width:100%;
height:100%;
overflow:hidden;
z-index:-1;
}

.glow span{
position:absolute;
display:block;
border-radius:50%;
background:rgba(0,212,255,.25);
animation:float 10s linear infinite;
}

.glow span:nth-child(1){
width:80px;height:80px;left:10%;top:70%;
}
.glow span:nth-child(2){
width:120px;height:120px;left:75%;top:20%;
background:rgba(255,215,0,.15);
}
.glow span:nth-child(3){
width:60px;height:60px;left:50%;top:85%;
background:rgba(140,0,255,.18);
}

@keyframes float{
0%{transform:translateY(0);}
100%{transform:translateY(-80px);}
}

/* TOP PANEL */
.top{
margin:16px;
padding:18px;
border-radius:35px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 25px rgba(0,170,255,.15),
0 0 35px rgba(255,215,0,.12);
}

.left{
display:flex;
gap:12px;
}

.badge{
padding:14px 18px;
border-radius:22px;
background:linear-gradient(145deg,#101827,#172554);
box-shadow:
0 0 18px rgba(0,180,255,.18),
inset 0 0 10px rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
font-size:14px;
font-weight:700;
}

.logo{
font-size:22px;
font-weight:900;
background:linear-gradient(to right,#00d4ff,#ffd700,#00d4ff);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px rgba(0,212,255,.25);
}

/* Banner */
.banner{
height:200px;
margin:16px;
border-radius:35px;
overflow:hidden;
position:relative;
box-shadow:
0 0 30px rgba(0,170,255,.15),
0 0 40px rgba(255,215,0,.08);
border:1px solid rgba(255,255,255,.08);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* Cards */
.menu{
padding:16px;
display:flex;
flex-direction:column;
gap:20px;
}

.card{
position:relative;
height:130px;
border-radius:35px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.35);
transition:.2s;
border:1px solid rgba(255,255,255,.08);
}

.card:active{
transform:scale(.97);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.6);
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:28px;
background:linear-gradient(
90deg,
rgba(0,0,0,.75),
rgba(0,0,0,.15)
);
}

.title{
font-size:28px;
font-weight:900;
}

.sub{
font-size:12px;
margin-top:5px;
opacity:.9;
}

.arrow{
font-size:35px;
}

/* Bottom Nav */
.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
padding:18px 0;
background:rgba(6,10,20,.92);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,.08);
box-shadow:0 -8px 30px rgba(0,0,0,.5);
}

.bottom div{
text-align:center;
font-size:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="glow">
<span></span>
<span></span>
<span></span>
</div>

<!-- Top -->
<div class="top">
<div class="left">
<div class="badge">👤 Profile</div>
<div class="badge">🪙 Coins: 250</div>
</div>

<div class="logo">
💎 Diamond Drop BD
</div>
</div>

<!-- Banner -->
<div class="banner">
<img id="slider" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
</div>

<!-- Menu -->
<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
<div class="overlay">
<div>
<div class="title">📋 TASKS</div>
<div class="sub">Complete tasks & earn rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200">
<div class="overlay">
<div>
<div class="title">🎡 SPIN</div>
<div class="sub">Spin & win big rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200">
<div class="overlay">
<div>
<div class="title">💥 SCRATCH</div>
<div class="sub">Scratch & win premium coins</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1486572788966-cfd3df1f5b42?w=1200">
<div class="overlay">
<div>
<div class="title">🎁 REDEEM</div>
<div class="sub">Claim luxury rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

</div>

<!-- Bottom -->
<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
const images = [
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let current = 0;
const slider = document.getElementById("slider");

setInterval(()=>{
current = (current + 1) % images.length;
slider.src = images[current];
},3000);
</script>

</body>
</html>
