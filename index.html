<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050816;
overflow-x:hidden;
color:white;
padding-bottom:110px;
}

/* Gaming Background */
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:
linear-gradient(
rgba(5,8,22,.82),
rgba(5,8,22,.88)
),
url('https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1600');

background-size:cover;
background-position:center;
background-repeat:no-repeat;

animation:bgZoom 12s infinite alternate ease-in-out;

z-index:-2;
}

@keyframes bgZoom{
0%{
transform:scale(1);
}
100%{
transform:scale(1.08);
}
}

/* TOP PANEL */
.top{
margin:16px;
padding:18px;
border-radius:35px;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.08);
box-shadow:
0 0 25px rgba(0,170,255,.15),
0 0 35px rgba(255,215,0,.12);
}

.left{
display:flex;
gap:12px;
}

.badge{
padding:14px 18px;
border-radius:22px;
background:linear-gradient(145deg,#101827,#172554);
box-shadow:
0 0 18px rgba(0,180,255,.18),
inset 0 0 10px rgba(255,255,255,.03);
border:1px solid rgba(255,255,255,.08);
font-size:14px;
font-weight:700;
}

/* Diamond Logo */
.logo{
font-size:22px;
font-weight:900;
background:linear-gradient(
to right,
#7df9ff,
#00d4ff,
#4facfe,
#00e5ff,
#7df9ff
);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:
0 0 8px rgba(0,212,255,.6),
0 0 18px rgba(0,212,255,.5),
0 0 30px rgba(125,249,255,.4);
letter-spacing:1px;
}

/* Banner */
.banner{
height:200px;
margin:16px;
border-radius:35px;
overflow:hidden;
position:relative;
box-shadow:
0 0 30px rgba(0,170,255,.15),
0 0 40px rgba(255,215,0,.08);
border:1px solid rgba(255,255,255,.08);
}

.banner img{
width:100%;
height:100%;
object-fit:cover;
}

/* Cards */
.menu{
padding:16px;
display:flex;
flex-direction:column;
gap:20px;
}

.card{
position:relative;
height:130px;
border-radius:35px;
overflow:hidden;
box-shadow:0 10px 35px rgba(0,0,0,.35);
transition:.2s;
border:1px solid rgba(255,255,255,.08);
}

.card:active{
transform:scale(.97);
}

.card img{
width:100%;
height:100%;
object-fit:cover;
filter:brightness(.6);
}

.overlay{
position:absolute;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
justify-content:space-between;
align-items:center;
padding:28px;
background:linear-gradient(
90deg,
rgba(0,0,0,.75),
rgba(0,0,0,.15)
);
}

.title{
font-size:28px;
font-weight:900;
}

.sub{
font-size:12px;
margin-top:5px;
opacity:.9;
}

.arrow{
font-size:35px;
}

/* Bottom Nav */
.bottom{
position:fixed;
bottom:0;
width:100%;
display:flex;
justify-content:space-around;
padding:18px 0;
background:rgba(6,10,20,.92);
backdrop-filter:blur(20px);
border-top:1px solid rgba(255,255,255,.08);
box-shadow:0 -8px 30px rgba(0,0,0,.5);
}

.bottom div{
text-align:center;
font-size:15px;
font-weight:bold;
}
</style>
</head>

<body>

<div class="bg"></div>

<!-- Top -->
<div class="top">
<div class="left">
<div class="badge">👤 Profile</div>
<div class="badge" id="coinBox">🪙 Coins: <span id="coins">0</span></div>
</div>

<div class="logo">
💎 Diamond Drop BD
</div>
</div>

<!-- Banner -->
<div class="banner">
<img id="slider" src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
</div>

<!-- Menu -->
<div class="menu">

<div class="card">
<img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200">
<div class="overlay">
<div>
<div class="title">📋 TASKS</div>
<div class="sub">Complete tasks & earn rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card" onclick="window.location.href='spin.html'">
<img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200">
<div class="overlay">
<div>
<div class="title">🎡 SPIN</div>
<div class="sub">Spin & win big rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200">
<div class="overlay">
<div>
<div class="title">💥 SCRATCH</div>
<div class="sub">Scratch & win premium coins</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

<div class="card">
<img src="https://images.unsplash.com/photo-1486572788966-cfd3df1f5b42?w=1200">
<div class="overlay">
<div>
<div class="title">🎁 REDEEM</div>
<div class="sub">Claim luxury rewards</div>
</div>
<div class="arrow">➜</div>
</div>
</div>

</div>

<!-- Bottom -->
<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
// Banner Slider
const images = [
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let current = 0;
const slider = document.getElementById("slider");

setInterval(()=>{
current = (current + 1) % images.length;
slider.src = images[current];
},3000);

// COIN SYSTEM
let coins = localStorage.getItem("coins");

if(coins === null){
coins = 0;
localStorage.setItem("coins", coins);
}

document.getElementById("coins").innerText = coins;

function addCoins(amount){
coins = parseInt(coins) + amount;
localStorage.setItem("coins", coins);
document.getElementById("coins").innerText = coins;
}

// NORMAL SPIN SYSTEM (24 HOURS)
function spinReward(){

let lastSpin = localStorage.getItem("lastSpin");
let now = Date.now();

if(lastSpin && (now - lastSpin < 86400000)){

let remaining =
86400000 - (now - lastSpin);

let hours =
Math.floor(remaining / (1000*60*60));

let minutes =
Math.floor((remaining % (1000*60*60)) / (1000*60));

alert(
"⏳ Free Spin already used!\n\nTry again in: "
+ hours + "h "
+ minutes + "m"
);

return;
}

let chance = Math.random();
let reward;

// 70% → 100-500
if(chance < 0.70){
reward =
Math.floor(Math.random() * 401) + 100;
}

// 25% → 500-800
else if(chance < 0.95){
reward =
Math.floor(Math.random() * 301) + 500;
}

// 5% → 900-1000 (RARE)
else{
reward =
Math.floor(Math.random() * 101) + 900;
}

addCoins(reward);

localStorage.setItem("lastSpin", now);

alert(
"🎉 Congratulations!\n\nYou won "
+ reward +
" Coins!"
);

}
  function openSpin(){
document.getElementById("spinPopup").style.display="flex";
}

function closeSpin(){
document.getElementById("spinPopup").style.display="none";
}

function spinWheel(){

const wheel =
document.getElementById("wheel");

let rotate =
Math.floor(Math.random()*3000)+3000;

wheel.style.transform =
"rotate(" + rotate + "deg)";

setTimeout(()=>{
alert("🎉 Spin system next step!");
},5000);

                        }
</script>

 <!-- Spin Popup -->
<div id="spinPopup" style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
z-index:999;
justify-content:center;
align-items:center;
flex-direction:column;
">

<div style="
width:280px;
height:280px;
border-radius:50%;
border:8px solid gold;
background:conic-gradient(
#00d4ff 0deg 36deg,
#111 36deg 72deg,
#00d4ff 72deg 108deg,
#111 108deg 144deg,
#00d4ff 144deg 180deg,
#111 180deg 216deg,
#00d4ff 216deg 252deg,
#111 252deg 288deg,
#00d4ff 288deg 324deg,
#111 324deg 360deg
);
display:flex;
justify-content:center;
align-items:center;
position:relative;
transition:5s ease-out;
" id="wheel">

<div style="
width:80px;
height:80px;
border-radius:50%;
background:gold;
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
color:black;
">
SPIN
</div>

</div>

<div style="
font-size:50px;
margin-top:-20px;
color:red;
">
⬆
</div>

<button onclick="spinWheel()" style="
margin-top:20px;
padding:14px 30px;
border:none;
border-radius:20px;
font-size:18px;
font-weight:bold;
background:gold;
">
Spin Now
</button>

<button onclick="closeSpin()" style="
margin-top:12px;
padding:10px 25px;
border:none;
border-radius:20px;
background:#333;
color:white;
">
Close
</button>

</div> 

</body>
</html>
