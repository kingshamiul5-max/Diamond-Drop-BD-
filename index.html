<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top,#132c63 0%,#050816 40%,#000000 100%);
color:white;
overflow-x:hidden;
padding-bottom:110px;
}

/* Moving glow background */
body::before{
content:'';
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle,#00ccff55 1px,transparent 1px),
radial-gradient(circle,#ffd70055 1px,transparent 1px);
background-size:80px 80px;
animation:moveBg 10s linear infinite;
z-index:-1;
}

@keyframes moveBg{
0%{transform:translateY(0);}
100%{transform:translateY(-80px);}
}

/* Top Premium Bar */
.top{
display:flex;
justify-content:space-between;
align-items:center;
margin:15px;
padding:15px;
border-radius:28px;
background:rgba(255,255,255,0.08);
backdrop-filter:blur(14px);
border:1px solid rgba(255,255,255,0.15);
box-shadow:
0 0 20px rgba(0,170,255,.3),
0 0 30px rgba(255,215,0,.2);
}

.profile-box,
.coin-box{
padding:14px 16px;
border-radius:20px;
background:linear-gradient(135deg,#101827,#172554);
border:1px solid rgba(255,255,255,.1);
box-shadow:0 0 18px rgba(0,180,255,.25);
font-weight:bold;
font-size:15px;
}

.logo{
font-size:24px;
font-weight:900;
background:linear-gradient(to right,#00d4ff,#ffd700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
text-shadow:0 0 20px rgba(0,200,255,.4);
}

/* Banner */
.banner{
margin:15px;
height:180px;
border-radius:28px;
background-size:cover;
background-position:center;
box-shadow:
0 0 25px rgba(0,200,255,.25),
0 0 30px rgba(255,215,0,.15);
border:2px solid rgba(255,255,255,.1);
}

/* Cards */
.menu{
padding:15px;
display:flex;
flex-direction:column;
gap:18px;
}

.card{
display:flex;
justify-content:space-between;
align-items:center;
padding:25px;
border-radius:28px;
font-size:24px;
font-weight:900;
transition:.2s;
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.12);
}

.card small{
display:block;
font-size:14px;
font-weight:normal;
margin-top:5px;
opacity:.9;
}

.card:active{
transform:scale(.96);
}

.tasks{
background:linear-gradient(135deg,#ff9800,#ff4d00);
box-shadow:0 0 25px rgba(255,100,0,.4);
}

.spin{
background:linear-gradient(135deg,#6a00ff,#d000ff);
box-shadow:0 0 25px rgba(162,0,255,.45);
}

.scratch{
background:linear-gradient(135deg,#0099ff,#00e5ff);
box-shadow:0 0 25px rgba(0,200,255,.4);
}

.redeem{
background:linear-gradient(135deg,#00b140,#00ff88);
box-shadow:0 0 25px rgba(0,255,120,.35);
}

.arrow{
font-size:32px;
}

/* Bottom nav */
.bottom{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
justify-content:space-around;
padding:18px 0;
background:rgba(5,10,25,.92);
backdrop-filter:blur(15px);
border-top:2px solid rgba(0,212,255,.25);
box-shadow:0 -5px 20px rgba(0,0,0,.5);
}

.bottom div{
font-size:18px;
font-weight:bold;
text-align:center;
}
</style>
</head>

<body>

<!-- Top -->
<div class="top">

<div style="display:flex;gap:10px;">
<div class="profile-box">👤 Profile</div>
<div class="coin-box">🪙 Coins: 250</div>
</div>

<div class="logo">
💎 Diamond Drop BD
</div>

</div>

<!-- Sliding Banner -->
<div class="banner" id="banner"></div>

<!-- Menu -->
<div class="menu">

<div class="card tasks">
<div>
📋 TASKS
<small>Complete Tasks & Earn Coins</small>
</div>
<span class="arrow">➜</span>
</div>

<div class="card spin">
<div>
🎡 SPIN
<small>Spin & Win Big Rewards</small>
</div>
<span class="arrow">➜</span>
</div>

<div class="card scratch">
<div>
💥 SCRATCH
<small>Scratch & Win Coins</small>
</div>
<span class="arrow">➜</span>
</div>

<div class="card redeem">
<div>
🎁 REDEEM
<small>Redeem Your Rewards</small>
</div>
<span class="arrow">➜</span>
</div>

</div>

<!-- Bottom -->
<div class="bottom">
<div>🏠<br>Home</div>
<div>🎁<br>Daily</div>
<div>🛒<br>Shop</div>
<div>👥<br>Refer</div>
</div>

<script>
const ads = [
"https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1200",
"https://images.unsplash.com/photo-1511512578047-dfb367046420?w=1200",
"https://images.unsplash.com/photo-1493711662062-fa541adb3fc8?w=1200"
];

let current = 0;
const banner = document.getElementById("banner");

function changeBanner(){
banner.style.backgroundImage=`url(${ads[current]})`;
current=(current+1)%ads.length;
}

changeBanner();
setInterval(changeBanner,3000);
</script>

</body>
</html>
