<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diamond Drop BD - Spin</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Orbitron',sans-serif;
}

body{
background:#050816;
overflow:hidden;
color:white;
height:100vh;
}
.bg{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:
linear-gradient(rgba(5,8,22,.85),rgba(5,8,22,.9)),
url("https://images.unsplash.com/photo-1542751371-adc38448a05e?w=1600");
background-size:cover;
background-position:center;
z-index:-3;
animation:bgZoom 12s infinite alternate;
}

@keyframes bgZoom{
0%{transform:scale(1);}
100%{transform:scale(1.08);}
}

.container{
width:100%;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.top{
position:absolute;
top:20px;
left:20px;
right:20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.top h1{
font-size:24px;
background:linear-gradient(90deg,#00d4ff,#ffd700);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.timer{
padding:12px 18px;
background:rgba(255,255,255,.08);
border:1px solid rgba(255,255,255,.15);
border-radius:16px;
backdrop-filter:blur(15px);
text-align:center;
font-size:13px;
}

.pointer{
width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-top:35px solid red;
margin-bottom:10px;
z-index:5;
}

.wheel{
width:320px;
height:320px;
border-radius:50%;
border:8px solid gold;
background:conic-gradient(#00d4ff,#0a0a0a,#00d4ff,#0a0a0a,#00d4ff,#0a0a0a,#00d4ff,#0a0a0a,#00d4ff,#0a0a0a);
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 0 25px #00d4ff,0 0 50px rgba(255,215,0,.5);
}

.center{
width:95px;
height:95px;
border-radius:50%;
background:linear-gradient(#ffd700,#ff9800);
display:flex;
justify-content:center;
align-items:center;
font-weight:bold;
font-size:22px;
color:#111;
cursor:pointer;
  }
  #spinBtn:hover{
transform:scale(1.08);
box-shadow:0 0 20px gold,0 0 40px #00d4ff;
}

.wheel{
transition:transform 5s cubic-bezier(.17,.67,.15,1);
}
</style>
</head>
<body>
<div class="bg"></div>
<a href="index.html" class="backBtn">✕</a>
<div class="container">

    <!-- Logo -->
    <div class="top">
        <h1>💎 Diamond Drop BD</h1>

        <div class="timer">
            FREE SPIN
            <br>
            <span id="timer">23:59:59</span>
        </div>
    </div>

    <!-- Pointer -->
    <div class="pointer"></div>

    <!-- Wheel -->
    <div class="wheel" id="wheel">

        <div class="center" id="spinBtn">
            SPIN
        </div>

    </div>

  </div>
  <script>
const wheel=document.getElementById("wheel");
const spinBtn=document.getElementById("spinBtn");

spinBtn.onclick=function(){

let deg=Math.floor(Math.random()*360)+3600;

wheel.style.transform="rotate("+deg+"deg");

}
    .backBtn{
position:fixed;
top:25px;
left:25px;
width:80px;
height:80px;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#00d4ff,#0066ff);
border:3px solid gold;
border-radius:20px;
font-size:45px;
font-weight:bold;
color:white;
text-decoration:none;
box-shadow:0 0 30px #00d4ff;
z-index:99999;
}
  </script>
</body>
</html>
